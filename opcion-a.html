function buildData(t) {
  const buildCatItems = (prefix, imgPrefix) => [1,2,3,4].map(n => ({
    name: t[`${prefix}Item${n}Name`],
    desc: t[`${prefix}Item${n}Desc`],
    price: t[`${prefix}Item${n}Price`],
    img: t[`img${imgPrefix}${n}`],
  }));

  return {
    ...window.APA_DEFAULTS,
    heroEyebrow: t.heroEyebrow,
    heroTitle: t.heroTitle,
    heroSubtitle: t.heroSubtitle,
    ctaPrimary: t.ctaPrimary,
    ctaSecondary: t.ctaSecondary,
    servicioAEyebrow: window.APA_DEFAULTS.servicioAEyebrow,
    servicioATitle: t.servicioATitle,
    servicioADesc: t.servicioADesc,
    servicioBEyebrow: window.APA_DEFAULTS.servicioBEyebrow,
    servicioBTitle: t.servicioBTitle,
    servicioBDesc: t.servicioBDesc,
    diff1Title: t.diff1Title, diff1Desc: t.diff1Desc,
    diff2Title: t.diff2Title, diff2Desc: t.diff2Desc,
    diff3Title: t.diff3Title, diff3Desc: t.diff3Desc,
    closingHook: t.closingHook,
    horecaTitle: t.horecaTitle, horecaDesc: t.horecaDesc,
    contactTitle: t.contactTitle, contactDesc: t.contactDesc,
    contactEmail: t.contactEmail, contactPhone: t.contactPhone, contactAddress: t.contactAddress,
    formWebhook: t.formWebhook, chatWebhook: t.chatWebhook, chatGreeting: t.chatGreeting,
    // Stats del hero
    stats: [
      { num: t.stat1Num, label: t.stat1Label },
      { num: t.stat2Num, label: t.stat2Label },
      { num: t.stat3Num, label: t.stat3Label },
    ],
    // Navegación
    navItems: t.navItems.split(',').map(s => s.trim()).filter(Boolean),
    // Footer
    footerTagline: t.footerTagline,
    footerCuit: t.footerCuit,
    footerColumns: [
      { title: t.footerCol1Title, items: t.footerCol1Items.split(',').map(s => s.trim()) },
      { title: t.footerCol2Title, items: t.footerCol2Items.split(',').map(s => s.trim()) },
      { title: t.footerCol3Title, items: t.footerCol3Items.split(',').map(s => s.trim()) },
    ],
    // Imágenes de secciones
    images: {
      heroA: t.imgHeroA, heroADetail: t.imgHeroADetail,
      servicioA: t.imgServicioA, servicioB: t.imgServicioB,
      horeca: t.imgHoreca,
    },
    catCarnes: { ...window.APA_DEFAULTS.catCarnes, items: buildCatItems('carnes', 'Carnes') },
    catAves: { ...window.APA_DEFAULTS.catAves, items: buildCatItems('aves', 'Aves') },
    catPastas: { ...window.APA_DEFAULTS.catPastas, items: buildCatItems('pastas', 'Pastas') },
    catSaludable: { ...window.APA_DEFAULTS.catSaludable, items: buildCatItems('salu', 'Salu') },
  };
}

function CatTweaks({ t, setTweak, prefix, imgPrefix, label }) {
  return (
    <>
      <TweakSection label={label}/>
      {[1,2,3,4].map(n => (
        <React.Fragment key={n}>
          <TweakText label={`#${n} Nombre`} value={t[`${prefix}Item${n}Name`]} onChange={v => setTweak(`${prefix}Item${n}Name`, v)}/>
          <TweakText label={`#${n} Descripción`} value={t[`${prefix}Item${n}Desc`]} onChange={v => setTweak(`${prefix}Item${n}Desc`, v)}/>
          <TweakText label={`#${n} Precio`} value={t[`${prefix}Item${n}Price`]} onChange={v => setTweak(`${prefix}Item${n}Price`, v)}/>
          <TweakImage label={`#${n} Foto`} value={t[`img${imgPrefix}${n}`]} onChange={v => setTweak(`img${imgPrefix}${n}`, v)}/>
        </React.Fragment>
      ))}
    </>
  );
}

function App() {
  const [t, setTweak, { resetearTweaks, exportarTweaks, importarTweaks }] = useTweaks(TWEAK_DEFAULTS);
  const data = React.useMemo(() => buildData(t), [t]);

  return (

      <TweaksPanel title="Editor · APA">
        <TweakSection label="Webhooks (chat + formulario)"/>

        <TweakText label="Webhook chat" value={t.chatWebhook} onChange={v => setTweak('chatWebhook', v)} placeholder="https://…"/>
        <TweakText label="Saludo del chat" value={t.chatGreeting} onChange={v => setTweak('chatGreeting', v)}/>

        <TweakSection label="Marca"/>
        <TweakColor label="Naranja (acento)" value={t.accent} onChange={v => setTweak('accent', v)}/>
        <TweakColor label="Azul marino" value={t.navy} onChange={v => setTweak('navy', v)}/>

        <TweakSection label="Hero"/>
        <TweakText label="Bajada arriba" value={t.heroEyebrow} onChange={v => setTweak('heroEyebrow', v)}/>
        <TweakText label="Título" value={t.heroTitle} onChange={v => setTweak('heroTitle', v)}/>
        <TweakText label="Subtítulo" value={t.heroSubtitle} onChange={v => setTweak('heroSubtitle', v)}/>
        <TweakText label="CTA primario" value={t.ctaPrimary} onChange={v => setTweak('ctaPrimary', v)}/>
        <TweakText label="CTA secundario" value={t.ctaSecondary} onChange={v => setTweak('ctaSecondary', v)}/>

        <TweakSection label="Estadísticas del hero"/>
        <TweakText label="Stat 1 · Número" value={t.stat1Num} onChange={v => setTweak('stat1Num', v)}/>
        <TweakText label="Stat 1 · Label" value={t.stat1Label} onChange={v => setTweak('stat1Label', v)}/>
        <TweakText label="Stat 2 · Número" value={t.stat2Num} onChange={v => setTweak('stat2Num', v)}/>
        <TweakText label="Stat 2 · Label" value={t.stat2Label} onChange={v => setTweak('stat2Label', v)}/>
        <TweakText label="Stat 3 · Número" value={t.stat3Num} onChange={v => setTweak('stat3Num', v)}/>
        <TweakText label="Stat 3 · Label" value={t.stat3Label} onChange={v => setTweak('stat3Label', v)}/>

        <TweakSection label="Servicios"/>
        <TweakText label="A · Título" value={t.servicioATitle} onChange={v => setTweak('servicioATitle', v)}/>
        <TweakText label="A · Descripción" value={t.servicioADesc} onChange={v => setTweak('servicioADesc', v)}/>
        <TweakText label="B · Título" value={t.servicioBTitle} onChange={v => setTweak('servicioBTitle', v)}/>
        <TweakText label="B · Descripción" value={t.servicioBDesc} onChange={v => setTweak('servicioBDesc', v)}/>

        <TweakSection label="Diferenciales"/>

        <TweakText label="1 · Descripción" value={t.diff1Desc} onChange={v => setTweak('diff1Desc', v)}/>
        <TweakText label="2 · Título" value={t.diff2Title} onChange={v => setTweak('diff2Title', v)}/>
        <TweakText label="2 · Descripción" value={t.diff2Desc} onChange={v => setTweak('diff2Desc', v)}/>
        <TweakText label="3 · Título" value={t.diff3Title} onChange={v => setTweak('diff3Title', v)}/>
        <TweakText label="3 · Descripción" value={t.diff3Desc} onChange={v => setTweak('diff3Desc', v)}/>

        <TweakSection label="HoReCa & Cierre"/>

        <TweakText label="HoReCa descripción" value={t.horecaDesc} onChange={v => setTweak('horecaDesc', v)}/>
        <TweakText label="Frase de cierre" value={t.closingHook} onChange={v => setTweak('closingHook', v)}/>

        <TweakSection label="Contacto"/>
        <TweakText label="Título contacto" value={t.contactTitle} onChange={v => setTweak('contactTitle', v)}/>
        <TweakText label="Descripción" value={t.contactDesc} onChange={v => setTweak('contactDesc', v)}/>
        <TweakText label="Email" value={t.contactEmail} onChange={v => setTweak('contactEmail', v)}/>
        <TweakText label="Teléfono" value={t.contactPhone} onChange={v => setTweak('contactPhone', v)}/>
        <TweakText label="Dirección" value={t.contactAddress} onChange={v => setTweak('contactAddress', v)}/>

        <TweakSection label="Navegación"/>
        <TweakText label="Items del menú (comas)" value={t.navItems} onChange={v => setTweak('navItems', v)}/>

        <TweakSection label="Footer"/>
        <TweakText label="Tagline" value={t.footerTagline} onChange={v => setTweak('footerTagline', v)}/>
        <TweakText label="CUIT" value={t.footerCuit} onChange={v => setTweak('footerCuit', v)}/>
        <TweakText label="Col 1 · Título" value={t.footerCol1Title} onChange={v => setTweak('footerCol1Title', v)}/>
        <TweakText label="Col 1 · Items (comas)" value={t.footerCol1Items} onChange={v => setTweak('footerCol1Items', v)}/>
        <TweakText label="Col 2 · Título" value={t.footerCol2Title} onChange={v => setTweak('footerCol2Title', v)}/>
        <TweakText label="Col 2 · Items (comas)" value={t.footerCol2Items} onChange={v => setTweak('footerCol2Items', v)}/>
        <TweakText label="Col 3 · Título" value={t.footerCol3Title} onChange={v => setTweak('footerCol3Title', v)}/>
        <TweakText label="Col 3 · Items (comas)" value={t.footerCol3Items} onChange={v => setTweak('footerCol3Items', v)}/>

        <TweakSection label="Imágenes · Hero y secciones"/>
        <TweakImage label="Hero principal" value={t.imgHeroA} onChange={v => setTweak('imgHeroA', v)}/>
        <TweakImage label="Detalle materia prima" value={t.imgHeroADetail} onChange={v => setTweak('imgHeroADetail', v)}/>
        <TweakImage label="Viandas Empresas" value={t.imgServicioA} onChange={v => setTweak('imgServicioA', v)}/>
        <TweakImage label="Market Hogar" value={t.imgServicioB} onChange={v => setTweak('imgServicioB', v)}/>
        <TweakImage label="HoReCa" value={t.imgHoreca} onChange={v => setTweak('imgHoreca', v)}/>

        <CatTweaks t={t} setTweak={setTweak} prefix="carnes" imgPrefix="Carnes" label="Catálogo · Carnes Rojas"/>
        <CatTweaks t={t} setTweak={setTweak} prefix="aves" imgPrefix="Aves" label="Catálogo · Aves"/>
        <CatTweaks t={t} setTweak={setTweak} prefix="pastas" imgPrefix="Pastas" label="Catálogo · Pastas"/>
        <CatTweaks t={t} setTweak={setTweak} prefix="salu" imgPrefix="Salu" label="Catálogo · Saludable"/>

        <TweakSection label="🔧 Herramientas"/>
        <TweakButton label="📥 Exportar configuración" onClick={exportarTweaks}/>
        <TweakButton label="📤 Importar configuración" onClick={importarTweaks} secondary/>
        <TweakButton label="🔄 Restaurar todo a defaults" onClick={() => { if (confirm('¿Seguro? Se pierden todos los cambios.')) resetearTweaks(); }} secondary/>
      </TweaksPanel>
    </>

}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
